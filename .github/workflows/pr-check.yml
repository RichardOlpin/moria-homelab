name: Validate Homelab Stacks & Scripts

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Compose & Bootstrap Scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax on all scripts
        run: |
          bash -n nodes/gandalf/bootstrap-ubuntu.sh
          bash -n nodes/erebor/bootstrap-nas.sh
          bash -n nodes/erebor/scripts/optimize-for-tablet.sh
          bash -n nodes/erebor/scripts/nightly-backup.sh
          bash -n autoinstall/make-cidata-usb.sh
          bash -n .githooks/pre-push

      - name: Validate Ubuntu Autoinstall Cloud-Init YAML
        run: |
          python3 -c 'import yaml, sys; [yaml.safe_load(open(f)) for f in ["autoinstall/gandalf/user-data", "autoinstall/erebor/user-data", "autoinstall/gandalf/meta-data", "autoinstall/erebor/meta-data"]]'

      - name: Validate gandalf Docker Compose syntax
        working-directory: nodes/gandalf
        run: |
          cp .env.example .env
          docker compose config -q

      - name: Validate erebor Docker Compose syntax
        working-directory: nodes/erebor
        run: |
          cp .env.example .env
          docker compose config -q
