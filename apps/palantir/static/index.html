<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PALANTÍR — Moria Media & Fire Tablet Portal</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #131822;
      --border: #232c3d;
      --gold: #eab308;
      --cyan: #38bdf8;
      --emerald: #10b981;
      --crimson: #f43f5e;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #161f30 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 4rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.1rem 2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 14, 20, 0.88);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .orb {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #38bdf8, #1d4ed8 60%, #090d16 100%);
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.55);
    }
    .brand h1 {
      font-size: 1.25rem;
      letter-spacing: 0.14em;
      font-weight: 700;
    }
    .brand span {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .nav-modes {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .mode-btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.95rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.83rem;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .mode-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .mode-btn.balrog-btn {
      border-color: rgba(244, 63, 94, 0.45);
      color: #fda4af;
      background: rgba(244, 63, 94, 0.12);
    }
    main {
      max-width: 1240px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }
    .search-hero {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.75rem;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .search-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .search-input {
      flex: 1;
      min-width: 240px;
      background: #0b0e14;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.85rem 1.1rem;
      border-radius: 10px;
      font-size: 0.95rem;
    }
    .btn-primary, .btn-gold, .btn-emerald {
      border: none;
      padding: 0.85rem 1.15rem;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.86rem;
    }
    .btn-primary {
      background: var(--cyan);
      color: #06121d;
    }
    .btn-gold {
      background: rgba(234, 179, 8, 0.16);
      color: var(--gold);
      border: 1px solid rgba(234, 179, 8, 0.4);
    }
    .btn-emerald {
      background: rgba(16, 185, 129, 0.16);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .quick-chips {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.9rem;
      align-items: center;
    }
    .chip {
      font-size: 0.78rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      cursor: pointer;
      border: 1px solid transparent;
    }
    .chip:hover {
      border-color: var(--cyan);
      color: var(--text);
    }
    .status-banner {
      margin: 0.5rem 0 1.25rem;
      font-size: 0.9rem;
      color: var(--cyan);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .poster {
      height: 150px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .badges {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.22rem 0.55rem;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
    }
    .badge.tablet {
      background: rgba(16, 185, 129, 0.25);
      border: 1px solid var(--emerald);
      color: #6ee7b7;
    }
    .badge.live {
      background: rgba(56, 189, 248, 0.28);
      border: 1px solid var(--cyan);
      color: #bae6fd;
    }
    .card-body {
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      flex: 1;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .meta {
      font-size: 0.8rem;
      color: var(--muted);
    }
    .vibe {
      font-size: 0.83rem;
      color: #cbd5e1;
      line-height: 1.4;
    }
    .actions {
      padding: 0 1.1rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .btn-stream, .btn-tablet {
      display: block;
      width: 100%;
      padding: 0.65rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
      border: 1px solid var(--border);
      text-align: center;
      text-decoration: none;
    }
    .btn-stream {
      background: rgba(56, 189, 248, 0.14);
      color: var(--cyan);
      border-color: rgba(56, 189, 248, 0.35);
    }
    .btn-tablet {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border-color: rgba(16, 185, 129, 0.4);
    }
    /* Cinema Video Player Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.92);
      backdrop-filter: blur(10px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .player-shell {
      width: 100%;
      max-width: 980px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75);
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }
    .player-close {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    video {
      width: 100%;
      max-height: 75vh;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="orb"></div>
      <div>
        <h1>PALANTÍR</h1>
        <span>Moria Media &bull; QuickSync 4K &bull; Fire Tablet Sync</span>
      </div>
    </div>
    <div class="nav-modes">
      <button class="mode-btn active" onclick="loadLibrary('all', this)">All Library</button>
      <button class="mode-btn" onclick="loadLibrary('tablet', this)">🔥 Fire Tablet Drawer</button>
      <button class="mode-btn" onclick="loadLibrary('kids', this)">🧒 Kids Safe Vault</button>
      <button class="mode-btn" onclick="openCompanionTab(this)">📱 Blueprint &amp; Live Chat</button>
      <button class="mode-btn balrog-btn" onclick="wakeBalrog()">⚡ Awaken Balrog (WoL)</button>
    </div>
  </header>

  <main>
    <section id="searchHero" class="search-hero">
      <div class="search-row">
        <input id="aiQuery" class="search-input" type="text" placeholder="Ask Palantír by mood, dragon, kids, or runtime (e.g. 'fantasy dragon quest' or 'kids rabbit comedy')..." onkeydown="if(event.key==='Enter') runAiSearch()" />
        <button class="btn-primary" onclick="runAiSearch()">AI Mood Search</button>
        <button class="btn-emerald" onclick="importVideoUrl()">📥 Import Video URL (YouTube)</button>
        <button id="seedBtn" class="btn-emerald" onclick="seedFreeMovies()">⬇ 4 Free HD Movies</button>
        <button class="btn-gold" onclick="requestMissing()">+ Request (Radarr/Sonarr)</button>
      </div>
      <div class="quick-chips">
        <span style="font-size:0.78rem;color:var(--muted);">Try:</span>
        <button class="chip" onclick="quickSearch('Middle-earth Fellowship fantasy')">💍 LOTR Fellowship</button>
        <button class="chip" onclick="quickSearch('dragon fantasy quest')">🐉 Dragon Fantasy (Sintel)</button>
        <button class="chip" onclick="quickSearch('kids rabbit family comedy')">🐰 Kids Safe Comedy (Big Buck Bunny)</button>
        <button class="chip" onclick="quickSearch('cyberpunk robot sci-fi')">🤖 Cyberpunk Sci-Fi (Tears of Steel)</button>
      </div>
    </section>

    <div id="statusBanner" class="status-banner"></div>
    <section id="mediaGrid" class="grid"></section>

    <!-- Mobile-Friendly Tailscale Blueprint & Live Chat Companion View -->
    <section id="companionView" style="display:none;">
      <div style="background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:1.25rem;margin-bottom:1.25rem;">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0.75rem;">
          <div>
            <strong style="color:var(--cyan);font-size:0.95rem;">📱 Tailscale Android Access Active</strong>
            <div id="tsUrls" style="font-size:0.83rem;color:var(--muted);margin-top:0.25rem;">Detecting Tailscale IP...</div>
            <div id="tokenUsageBar" style="font-size:0.81rem;color:#cbd5e1;margin-top:0.4rem;"></div>
          </div>
          <div style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;">
            <button class="mode-btn active" id="subTabChat" onclick="switchCompanionSub('chat')">💬 Live Conversation</button>
            <button class="mode-btn" id="subTabArch" onclick="switchCompanionSub('arch')">📐 Hardware BOM &amp; Blueprint</button>
            <button class="mode-btn" id="subTabLogs" onclick="switchCompanionSub('logs')">📡 Live Server Logs</button>
            <button class="btn-emerald" style="padding:0.45rem 0.9rem;" onclick="refreshCompanionData()">🔄 Refresh (Auto 5s)</button>
          </div>
        </div>
      </div>

      <div id="convSelectorBar" style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.85rem;align-items:center;"></div>

      <div id="mobileChatComposer" style="background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:0.85rem 1rem;margin-bottom:1rem;display:flex;flex-direction:column;gap:0.5rem;">
        <div style="display:flex;gap:0.6rem;flex-wrap:wrap;">
          <input id="mobileMsgInput" class="search-input" type="text" placeholder="Type a message or instruction from your phone..." onkeydown="if(event.key==='Enter') sendMobileMessage()" />
          <button class="btn-primary" onclick="sendMobileMessage()">📲 Send to Moria</button>
          <button class="mode-btn" id="sortOrderBtn" onclick="toggleChatSortOrder()">🔽 Newest at Top</button>
        </div>
        <div id="mobileSendStatus" style="font-size:0.8rem;color:#6ee7b7;display:none;"></div>
      </div>

      <div id="chatFeedContainer" style="display:flex;flex-direction:column;gap:0.85rem;"></div>
      <pre id="archContainer" style="display:none;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:1.25rem;white-space:pre-wrap;word-wrap:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.84rem;line-height:1.55;color:#e2e8f0;overflow-x:auto;"></pre>
      <pre id="logsContainer" style="display:none;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:1.25rem;white-space:pre-wrap;word-wrap:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:0.82rem;line-height:1.5;color:#6ee7b7;overflow-x:auto;"></pre>
    </section>
  </main>

  <!-- Built-in HTML5 Cinema Video Player Modal -->
  <div id="playerModal" class="modal-backdrop" onclick="if(event.target===this) closePlayer()">
    <div class="player-shell">
      <div class="player-header">
        <strong id="playerTitle">Now Playing</strong>
        <button class="player-close" onclick="closePlayer()">✕ Close Player</button>
      </div>
      <video id="videoEl" controls playsinline></video>
    </div>
  </div>

  <script>
    let companionCache = null;
    let selectedConvId = 'all';
    let newestFirst = true;

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function toggleChatSortOrder() {
      newestFirst = !newestFirst;
      document.getElementById('sortOrderBtn').textContent = newestFirst ? '🔽 Newest at Top' : '🔼 Oldest at Top';
      renderCompanionChat();
    }

    function selectConversation(cid) {
      selectedConvId = cid;
      renderCompanionChat();
    }

    async function openCompanionTab(btnEl) {
      if (btnEl) {
        document.querySelectorAll('header .mode-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
      }
      document.getElementById('searchHero').style.display = 'none';
      document.getElementById('mediaGrid').style.display = 'none';
      document.getElementById('statusBanner').style.display = 'none';
      document.getElementById('companionView').style.display = 'block';
      await refreshCompanionData();
    }

    function switchCompanionSub(which) {
      document.getElementById('subTabChat').classList.toggle('active', which === 'chat');
      document.getElementById('subTabArch').classList.toggle('active', which === 'arch');
      document.getElementById('subTabLogs').classList.toggle('active', which === 'logs');
      document.getElementById('convSelectorBar').style.display = which === 'chat' ? 'flex' : 'none';
      document.getElementById('mobileChatComposer').style.display = which === 'chat' ? 'flex' : 'none';
      document.getElementById('chatFeedContainer').style.display = which === 'chat' ? 'flex' : 'none';
      document.getElementById('archContainer').style.display = which === 'arch' ? 'block' : 'none';
      document.getElementById('logsContainer').style.display = which === 'logs' ? 'block' : 'none';
    }

    async function sendMobileMessage() {
      const input = document.getElementById('mobileMsgInput');
      const statusEl = document.getElementById('mobileSendStatus');
      const text = (input.value || '').trim();
      if (!text) return;
      input.value = '';
      statusEl.style.display = 'block';
      statusEl.style.color = 'var(--cyan)';
      statusEl.textContent = '⏳ Sending message to Moria...';
      try {
        const res = await fetch('/api/mobile-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text,
            conversation_id: selectedConvId === 'all' ? '' : selectedConvId
          })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        statusEl.style.color = '#6ee7b7';
        statusEl.textContent = `✅ Sent: "${text}"`;
        await refreshCompanionData();
      } catch (err) {
        statusEl.style.color = '#fca5a5';
        statusEl.textContent = `⚠️ Failed to send (${err.message}). Try refreshing.`;
      }
    }

    function renderCompanionChat() {
      if (!companionCache) return;
      const convs = companionCache.conversations || [];
      const bar = document.getElementById('convSelectorBar');
      const pills = [
        `<button class="mode-btn ${selectedConvId === 'all' ? 'active' : ''}" onclick="selectConversation('all')">🔀 All Project Chats (${(companionCache.messages || []).length})</button>`,
        ...convs.map(c =>
          `<button class="mode-btn ${selectedConvId === c.id ? 'active' : ''}" onclick="selectConversation('${escapeHtml(c.id)}')">${escapeHtml(c.title)} (${c.count})</button>`
        )
      ];
      bar.innerHTML = `<span style="font-size:0.78rem;color:var(--muted);">Switch Chat:</span>` + pills.join('');

      let activeMessages = companionCache.messages || [];
      if (selectedConvId !== 'all') {
        const found = convs.find(c => c.id === selectedConvId);
        if (found) activeMessages = found.messages || [];
      }

      const ordered = newestFirst ? [...activeMessages].reverse() : [...activeMessages];
      const feed = document.getElementById('chatFeedContainer');
      feed.innerHTML = ordered.map(m => {
        const isUser = m.role === 'user';
        const isMobile = m.source && m.source.includes('android');
        const bg = isUser ? 'rgba(56, 189, 248, 0.12)' : '#131822';
        const border = isUser ? 'rgba(56, 189, 248, 0.4)' : '#232c3d';
        const label = isUser ? (isMobile ? '📲 You (Phone)' : '🧑 You') : '🤖 Antigravity';
        const chatTag = (selectedConvId === 'all' && m.chat_title)
          ? `<span class="badge" style="margin-left:0.5rem;">${escapeHtml(m.chat_title)}</span>`
          : '';
        return `
          <div style="background:${bg};border:1px solid ${border};border-radius:14px;padding:1rem 1.15rem;">
            <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.76rem;color:var(--muted);margin-bottom:0.45rem;">
              <div><strong style="color:${isUser ? 'var(--cyan)' : '#6ee7b7'}">${label}</strong>${chatTag}</div>
              <span>${escapeHtml(m.time ? new Date(m.time).toLocaleTimeString() : '')}</span>
            </div>
            <div style="white-space:pre-wrap;word-wrap:break-word;font-size:0.9rem;line-height:1.5;color:var(--text);">${escapeHtml(m.text)}</div>
          </div>
        `;
      }).join('');
    }

    async function refreshCompanionData() {
      const res = await fetch('/api/homelab-info');
      companionCache = await res.json();
      document.getElementById('tsUrls').innerHTML =
        `Tailscale URL: <code style="color:#6ee7b7">${escapeHtml(companionCache.tailscale_url)}</code> &bull; Home Wi-Fi URL: <code style="color:#bae6fd">${escapeHtml(companionCache.lan_url)}</code>`;
      if (companionCache.token_usage) {
        const u = companionCache.token_usage;
        document.getElementById('tokenUsageBar').innerHTML =
          `📊 <strong style="color:#f59e0b">${escapeHtml(u.plan)}</strong> &bull; Turns: <code>${u.turns}</code> &bull; Fresh In: <code>${(u.input_tokens / 1e6).toFixed(2)}M</code> &bull; Cached: <code>${(u.cache_read_tokens / 1e6).toFixed(2)}M (${u.cache_hit_pct}%)</code> &bull; Out: <code>${(u.output_tokens / 1e3).toFixed(1)}K</code>`;
      }
      document.getElementById('archContainer').textContent = companionCache.architecture_md || '';
      document.getElementById('logsContainer').textContent =
        (companionCache.recent_logs && companionCache.recent_logs.length)
          ? companionCache.recent_logs.join('\n')
          : 'No log entries recorded yet.';
      renderCompanionChat();
    }

    setInterval(() => {
      const comp = document.getElementById('companionView');
      if (comp && comp.style.display !== 'none') {
        refreshCompanionData();
      }
    }, 5000);

    async function importVideoUrl() {
      const url = prompt("Paste a YouTube or direct video URL you own to import into Palantír:", "https://www.youtube.com/watch?v=tsVH9WHrkRE");
      if (!url) return;
      const title = prompt("Optional Title (leave blank to auto-detect from URL):", "The Lord of the Rings The Fellowship of the Ring (2001)") || "";
      const banner = document.getElementById('statusBanner');
      banner.textContent = `⏳ Importing "${title || url}" via yt-dlp into local MP4 library...`;
      const res = await fetch('/api/import-url', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, title, kids_safe: false })
      });
      const data = await res.json();
      await loadLibrary('all');
      banner.textContent = data.error ? `⚠️ ${data.error}` : `✅ ${data.message}`;
    }

    function openPlayer(itemId, title, isPlayable) {
      if (!isPlayable) {
        alert(`"${title}" is a catalog preview placeholder. Click a title with the "● Playable on Disk" badge (like Sintel, Big Buck Bunny, Tears of Steel, or Elephants Dream) to watch live video!`);
        return;
      }
      const modal = document.getElementById('playerModal');
      const video = document.getElementById('videoEl');
      document.getElementById('playerTitle').textContent = `▶ ${title} — Direct Play Stream`;
      video.src = `/api/stream/${itemId}`;
      modal.classList.add('open');
      video.play();
    }

    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const video = document.getElementById('videoEl');
      video.pause();
      video.removeAttribute('src');
      video.load();
      modal.classList.remove('open');
    }

    function renderItems(items, bannerText) {
      document.getElementById('statusBanner').textContent = bannerText || '';
      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = items.map(item => `
        <article class="card">
          <div>
            <div class="poster" style="background: ${item.poster_gradient}">
              <div class="badges">
                ${item.playable ? `<span class="badge live">● Playable on Disk</span>` : `<span class="badge">Catalog Preview</span>`}
                ${item.resolutions.map(r => `<span class="badge ${r.includes('Tablet') ? 'tablet' : ''}">${r}</span>`).join('')}
              </div>
              <span class="badge" style="align-self:flex-start">${item.rating} &bull; ${item.runtime_min}m</span>
            </div>
            <div class="card-body">
              <div class="card-title">${item.title} (${item.year})</div>
              <div class="meta">${item.genres.join(' • ')}</div>
              <p class="vibe">${item.vibe}</p>
            </div>
          </div>
          <div class="actions">
            <button class="btn-stream" onclick="openPlayer('${item.id}', '${item.title.replace(/'/g, "\\'")}', ${Boolean(item.playable)})">
              ▶ ${item.playable ? 'Watch Live Stream (In-Browser)' : 'Watch Stream (Preview)'}
            </button>
            ${item.tablet_ready && item.playable
              ? `<a class="btn-tablet" href="/api/download/${item.id}" download>⬇ Save to Fire Tablet (${item.tablet_size_mb} MB MP4)</a>`
              : item.tablet_ready
              ? `<button class="btn-tablet" onclick="alert('Preview item: once on disk, clicking here downloads the pre-optimized 720p MP4 directly to your Fire Tablet.')">⬇ Save to Fire Tablet (${item.tablet_size_mb} MB MP4)</button>`
              : ''}
          </div>
        </article>
      `).join('');
    }

    async function loadLibrary(mode, btnEl) {
      document.getElementById('companionView').style.display = 'none';
      document.getElementById('searchHero').style.display = 'block';
      document.getElementById('mediaGrid').style.display = 'grid';
      document.getElementById('statusBanner').style.display = 'block';
      if (btnEl) {
        document.querySelectorAll('header .mode-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
      }
      const res = await fetch(`/api/library?mode=${mode}`);
      const data = await res.json();
      const seedBtn = document.getElementById('seedBtn');
      if (data.playable_count >= 4 && seedBtn) {
        seedBtn.textContent = `✓ ${data.playable_count} Local Movies Ready`;
      }
      const label = mode === 'tablet'
        ? '🔥 Showing pre-optimized 720p H.264 MP4s ready for instant Amazon Fire Tablet download'
        : mode === 'kids'
        ? '🧒 Kids Safe Vault (/mnt/mithril/media/kids-*) — Parental Lock Active'
        : `Connected to ${data.engine} (${data.items.length} titles total)`;
      renderItems(data.items, label);
    }

    async function seedFreeMovies() {
      const banner = document.getElementById('statusBanner');
      banner.textContent = '⏳ Downloading 4 free HD Creative Commons movies (Sintel, Big Buck Bunny, Tears of Steel, Elephants Dream)...';
      const res = await fetch('/api/seed-movies', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}' });
      const data = await res.json();
      await loadLibrary('all');
      banner.textContent = `✅ ${data.message}`;
    }

    async function wakeBalrog() {
      const res = await fetch('/api/wake-balrog', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}' });
      const data = await res.json();
      document.getElementById('statusBanner').textContent = `⚡ ${data.message}`;
    }

    async function runAiSearch() {
      const query = document.getElementById('aiQuery').value;
      const res = await fetch('/api/ai-search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query })
      });
      const data = await res.json();
      renderItems(data.items, `✨ ${data.explanation}`);
    }

    function quickSearch(q) {
      document.getElementById('aiQuery').value = q;
      runAiSearch();
    }

    async function requestMissing() {
      const title = prompt("Enter a Movie or TV Show to grab via Radarr/Sonarr + pre-encode for Fire Tablet:");
      if (!title) return;
      const res = await fetch('/api/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      const data = await res.json();
      document.getElementById('statusBanner').textContent = `✅ ${data.message}`;
    }

    loadLibrary('all');
  </script>
</body>
</html>
