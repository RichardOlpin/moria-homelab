name: erebor-core

services:
  # ============================================================================
  # Palantir Custom AI Frontend & Fire Tablet Portal (Port 8080)
  # ============================================================================
  palantir-ui:
    build: ../../apps/palantir
    container_name: palantir-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PALANTIR_PORT=8080
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYSEERR_URL=http://jellyseerr:5055
      - OLLAMA_URL=http://balrog.moria.lan:11434

  # ============================================================================
  # Palantir Media Engine (Jellyfin w/ Intel UHD 730 QuickSync Hardware Accel)
  # ============================================================================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: palantir-engine
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "${RENDER_GID:-109}" # Grants access to Intel QuickSync /dev/dri/renderD128
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "8096:8096"
    volumes:
      - /mnt/nvme/appdata/jellyfin/config:/config
      - /mnt/nvme/appdata/jellyfin/cache:/cache
      - /mnt/mithril/media:/data/media:ro
    environment:
      - TZ=${TZ:-America/Denver}

  # ============================================================================
  # Immich: Self-Hosted Google Photos Replacement (Backed by ZFS 'mithril/photos')
  # ============================================================================
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich-server
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "2283:2283"
    volumes:
      - /mnt/mithril/photos:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    depends_on:
      - immich-redis
      - immich-postgres

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    container_name: immich-machine-learning
    restart: unless-stopped
    volumes:
      - /mnt/nvme/appdata/immich-cache:/cache
    env_file:
      - .env

  immich-redis:
    image: docker.io/redis:6.2-alpine
    container_name: immich-redis
    restart: unless-stopped

  immich-postgres:
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0
    container_name: immich-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mithril_secret_db_pass}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - /mnt/nvme/appdata/immich-pg:/var/lib/postgresql/data

  # ============================================================================
  # Media Acquisition & Request Pipeline (*arr Stack)
  # ============================================================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - /mnt/nvme/appdata/prowlarr:/config
    ports:
      - "9696:9696"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - /mnt/nvme/appdata/radarr:/config
      - /mnt/mithril/media:/data/media # Shared root allows instant ZFS atomic hardlinks
    ports:
      - "7878:7878"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
    volumes:
      - /mnt/nvme/appdata/sonarr:/config
      - /mnt/mithril/media:/data/media
    ports:
      - "8989:8989"

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    environment:
      - TZ=${TZ:-America/Denver}
    volumes:
      - /mnt/nvme/appdata/jellyseerr:/app/config
    ports:
      - "5055:5055"

  # ============================================================================
  # AI Coding Workbench (24/7 Container Sandbox for Building 'Palantir' & Apps)
  # ============================================================================
  ai-workbench:
    image: lscr.io/linuxserver/code-server:latest
    container_name: ai-workbench
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Denver}
      - PASSWORD=${CODE_SERVER_PASSWORD:-mellon}
      - SUDO_PASSWORD=${CODE_SERVER_PASSWORD:-mellon}
      - DEFAULT_WORKSPACE=/config/workspace
    volumes:
      - /mnt/nvme/appdata/code-server:/config
      - /mnt/nvme/workspaces:/config/workspace
      - /mnt/mithril/media:/data/media:ro # Read-only access for testing Palantir UI
      - /var/run/docker.sock:/var/run/docker.sock # Spawn preview containers directly
    ports:
      - "8443:8443"

  # ============================================================================
  # RomM: Self-Hosted Retro Game Library & Browser EmulatorJS (arcade.moria.lan)
  # Play SNES/GBA/N64/PS1 in browser or on Fire Tablets w/ synced save states
  # ============================================================================
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    environment:
      - DB_HOST=romm-db
      - DB_NAME=romm
      - DB_USER=romm-user
      - DB_PASSWD=${ROMM_DB_PASSWORD:-mithril_romm_pass}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY:-change_me_32_byte_hex_secret_key_for_romm}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID:-}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET:-}
    volumes:
      - /mnt/nvme/appdata/romm/resources:/romm/resources
      - /mnt/nvme/appdata/romm/redis-data:/redis-data
      - /mnt/mithril/roms/library:/romm/library
      - /mnt/mithril/roms/assets:/romm/assets
      - /mnt/mithril/roms/config:/romm/config
    ports:
      - "8098:8080"
    depends_on:
      - romm-db

  romm-db:
    image: mariadb:11
    container_name: romm-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${ROMM_DB_ROOT_PASSWORD:-mithril_romm_root}
      - MYSQL_DATABASE=romm
      - MYSQL_USER=romm-user
      - MYSQL_PASSWORD=${ROMM_DB_PASSWORD:-mithril_romm_pass}
    volumes:
      - /mnt/nvme/appdata/romm-db:/var/lib/mysql

  # ============================================================================
  # Papra: Minimalist Document & Receipt Vault (docs.moria.lan)
  # ============================================================================
  papra:
    image: ghcr.io/papra-hq/papra:latest
    container_name: papra
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - APP_BASE_URL=https://docs.moria.lan
      - AUTH_SECRET=${PAPRA_AUTH_SECRET:-change_me_papra_secret_key}
    volumes:
      - /mnt/mithril/cloud/papra:/app/data
    ports:
      - "1221:1221"

