- Media & Streaming:
    - Palantír (Jellyfin):
        icon: jellyfin.png
        href: http://palantir.moria.lan
        description: 4K HDR QuickSync Streaming Server
        server: my-docker
        container: palantir-engine
        widget:
          type: jellyfin
          url: http://caddy
          key: {{HOMEPAGE_VAR_JELLYFIN_KEY}}
          enableNowPlaying: true
          enableUser: false

    - Seerr:
        icon: overseerr.png
        href: http://seerr.moria.lan
        description: Media Discovery & Request Portal
        server: my-docker
        container: seerr
        widget:
          type: jellyseerr
          url: http://seerr:5055
          key: {{HOMEPAGE_VAR_SEERR_KEY}}

    - Immich:
        icon: immich.png
        href: http://photos.moria.lan
        description: High-Res Photos & Facial Recognition
        server: my-docker
        container: immich-server

    - Palantír UI:
        icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/play-button.png
        href: http://portal.moria.lan
        description: Custom Family Portal & Tablet UI
        server: my-docker
        container: palantir-ui

- Acquisition & Torrents:
    - Radarr:
        icon: radarr.png
        href: http://radarr.moria.lan
        description: Movies Acquisition Engine
        server: my-docker
        container: radarr
        widget:
          type: radarr
          url: http://radarr:7878
          key: {{HOMEPAGE_VAR_RADARR_KEY}}

    - Sonarr:
        icon: sonarr.png
        href: http://sonarr.moria.lan
        description: TV Shows Acquisition Engine
        server: my-docker
        container: sonarr
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: {{HOMEPAGE_VAR_SONARR_KEY}}

    - Prowlarr:
        icon: prowlarr.png
        href: http://prowlarr.moria.lan
