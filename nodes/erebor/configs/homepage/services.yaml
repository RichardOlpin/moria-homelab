        server: my-docker
        container: prowlarr
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: {{HOMEPAGE_VAR_PROWLARR_KEY}}

    - qBittorrent:
        icon: qbittorrent.png
        href: http://downloads.moria.lan
        description: High-Speed Torrent Client
        server: my-docker
        container: qbittorrent
        widget:
          type: qbittorrent
          url: http://qbittorrent:8085
          username: admin
          password: adminpassword

