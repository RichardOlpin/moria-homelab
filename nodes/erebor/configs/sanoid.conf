# ==============================================================================
# /etc/sanoid/sanoid.conf for Node 2: 'erebor' (ZFS Pool: 'mithril')
# Automated atomic ZFS snapshots & pruning
# ==============================================================================

[mithril/photos]
	use_template = critical
	recursive = yes

[mithril/cloud]
	use_template = critical
	recursive = yes

[mithril/backups]
	use_template = critical
	recursive = yes

[mithril/media]
	use_template = media
	recursive = yes

[mithril/timemachine]
	use_template = timemachine
	recursive = yes

# ==============================================================================
# Templates
# ==============================================================================

[template_critical]
	frequently = 0
	hourly = 24
	daily = 30
	monthly = 12
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_media]
	frequently = 0
	hourly = 0
	daily = 7
	monthly = 2
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_timemachine]
	frequently = 0
	hourly = 0
	daily = 7
	monthly = 1
	yearly = 0
	autosnap = yes
	autoprune = yes
