# ==============================================================================
# /etc/samba/smb.conf for Node 2: 'erebor'
# Tuned for Apple Silicon macOS ('strider') Wireless Time Machine & 2.5GbE LAN
# ==============================================================================

[global]
   workgroup = MORIA
   server string = Erebor ZFS NAS
   server role = standalone server
   security = user
   map to guest = Bad User
   server min protocol = SMB3

   # Disable legacy printing subsystems
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # Apple macOS (vfs_fruit) Performance & Finder Integration
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

   # High-throughput 2.5GbE socket tuning
   use sendfile = yes
   aio read size = 1
   aio write size = 1

# ==============================================================================
# 1. Wireless Time Machine Backup Target for M1 MacBook Pro ('strider')
# ==============================================================================
[TimeMachine-Strider]
   comment = M1 MacBook Pro Time Machine Backup (ZFS Quota 1.5TB)
   path = /mnt/mithril/timemachine
   browseable = yes
   writeable = yes
   valid users = ubuntu
   create mask = 0600
   directory mask = 0700
   vfs objects = catia fruit streams_xattr
   fruit:time machine = yes
   fruit:time machine max size = 1500G

# ==============================================================================
# 2. Mithril Media Share (Movies, TV, Kids Fire Tablet Videos)
# ==============================================================================
[Mithril-Media]
   comment = Moria Media Library
   path = /mnt/mithril/media
   browseable = yes
   writeable = yes
   valid users = ubuntu
   create mask = 0664
   directory mask = 0775

# ==============================================================================
# 3. Mithril Personal Cloud Share (Fast LAN File Drop)
# ==============================================================================
[Mithril-Cloud]
   comment = Moria Personal Cloud & Documents
   path = /mnt/mithril/cloud
   browseable = yes
   writeable = yes
   valid users = ubuntu
   create mask = 0660
   directory mask = 0770
